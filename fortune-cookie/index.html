<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fortune Cookie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1f1b3d;
    --ink-soft: #5b5780;
    --periwinkle: #bcc3ff;
    --blush: #ffcfd8;
    --peach: #ffe3c7;
    --paper: #fffdf8;
    --amber: #f2a93b;
    --amber-deep: #c96f1c;
    --focus: #5b4bff;
    --sans: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; margin: 0; }

  body {
    font-family: var(--sans);
    color: var(--ink);
    background:
      url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><g fill='%23735240' fill-opacity='0.10'><polygon points='20,30 31,26 38,34 32,43 22,41' transform='rotate(20 28 34)'/><polygon points='112,18 121,15 127,22 121,29 113,27' transform='rotate(-30 119 22)'/><polygon points='150,96 162,93 168,102 160,110 151,106' transform='rotate(45 158 101)'/><polygon points='64,112 74,108 81,116 74,124 65,121' transform='rotate(-10 72 116)'/><polygon points='30,150 38,148 42,155 36,161 29,158' transform='rotate(60 35 154)'/><polygon points='118,150 126,146 132,153 126,160 118,157' transform='rotate(15 125 153)'/></g></svg>"),
      radial-gradient(50rem 36rem at 12% 8%, rgba(214, 219, 255, .55) 0%, transparent 60%),
      radial-gradient(46rem 34rem at 92% 18%, rgba(255, 224, 230, .55) 0%, transparent 60%),
      #fbf9fd;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
    min-height: 100%;
    overflow-x: hidden;
  }

  main {
    width: 100%;
    max-width: 460px;
    margin: auto;
    text-align: center;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2.4rem, 9vw, 3.4rem);
    letter-spacing: -0.01em;
    line-height: 1;
    margin: 0 0 6px;
  }

  .sub {
    margin: 0;
    color: var(--ink-soft);
    font-size: 1rem;
    min-height: 1.5em;
  }

  /* ---------- Stage ---------- */
  .stage {
    position: relative;
    width: 100%;
    height: 320px;
    margin: 12px auto 4px;
  }

  .cookie {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 300px;
    max-width: 84vw;
    aspect-ratio: 3 / 2;
    transform: translate(-50%, -50%);
    padding: 0;
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    border-radius: 40%;
  }
  .cookie:focus-visible { outline: 3px solid var(--focus); outline-offset: 6px; }
  .cookie[disabled] { cursor: default; }

  .cookie svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 14px 14px rgba(110, 70, 40, 0.22));
    transition: transform 0.25s ease;
    animation: float 3.6s ease-in-out infinite;
  }
  .cookie:hover:not([disabled]) svg { transform: scale(1.04) rotate(-2deg); }
  .cookie:active:not([disabled]) svg { transform: scale(0.97); }

  @keyframes float {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -8px; }
  }

  .is-shaking svg { animation: shake 0.5s cubic-bezier(.36,.07,.19,.97) both; }

  @keyframes shake {
    0%, 100% { transform: translate(0) rotate(0); }
    15% { transform: translate(-6px, 0) rotate(-6deg); }
    30% { transform: translate(7px, 0) rotate(6deg); }
    45% { transform: translate(-8px, 0) rotate(-8deg); }
    60% { transform: translate(8px, 0) rotate(8deg); }
    75% { transform: translate(-4px, 0) rotate(-3deg); }
  }

  .half {
    transform-box: view-box;
    transform-origin: 150px 100px;
    transition: transform 0.7s cubic-bezier(.2,.9,.3,1.2), opacity 0.7s ease 0.25s;
  }
  .is-open .cookie svg { animation: none; }
  .is-open .half.left  { transform: translate(-80px, 60px) rotate(-26deg); opacity: 0; }
  .is-open .half.right { transform: translate(80px, 60px) rotate(26deg);  opacity: 0; }

  /* ---------- Slip ---------- */
  .slip {
    position: absolute;
    left: 50%;
    top: 50%;
    width: min(92vw, 420px);
    padding: 26px 26px 20px;
    background: var(--paper);
    border-radius: 6px;
    box-shadow: 0 1px 0 rgba(31,27,61,.06), 0 24px 40px -12px rgba(60, 40, 140, .35);
    transform: translate(-50%, -50%) scaleX(0.12) rotate(-2deg);
    transform-origin: center;
    opacity: 0;
    pointer-events: none;
    transition: transform 0.65s cubic-bezier(.2,1,.3,1) 0.15s, opacity 0.2s ease 0.15s;
  }
  .slip::before,
  .slip::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 10px;
    background: radial-gradient(circle at 0 50%, transparent 4px, var(--paper) 4.5px) 0 0 / 10px 14px repeat-y;
  }
  .slip::before { left: -9px; }
  .slip::after  { right: -9px; transform: scaleX(-1); }

  .is-open .slip {
    opacity: 1;
    transform: translate(-50%, -50%) scaleX(1) rotate(-2deg);
    pointer-events: auto;
  }

  .fortune {
    font-family: var(--serif);
    font-style: italic;
    font-size: clamp(1.55rem, 6.4vw, 2rem);
    line-height: 1.25;
    margin: 0;
    text-wrap: balance;
  }

  /* ---------- Crumbs ---------- */
  .crumb {
    position: absolute;
    left: 50%; top: 50%;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--amber);
    pointer-events: none;
  }

  /* ---------- Buttons ---------- */
  .btn {
    font-family: var(--sans);
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
    background: var(--ink);
    border: 0;
    border-radius: 999px;
    padding: 14px 26px;
    cursor: pointer;
    transition: transform .15s ease, background .2s ease, opacity .3s ease;
  }
  .btn:hover { background: #342d6b; }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .again {
    opacity: 0;
    visibility: hidden;
    margin-top: 6px;
  }
  .is-open ~ .again { opacity: 1; visibility: visible; }

  @media (prefers-reduced-motion: reduce) {
    .cookie svg, .is-shaking svg { animation: none; }
    .half, .slip { transition-duration: .01s; transition-delay: 0s; }
  }
</style>
</head>

    <button class="btn again" id="again" type="button">Open another cookie</button>
  </main>

<script>
(() => {
  const MESSAGE = "I’m genuinely sorry for what happened yesterday. 🥺💔😔🙏";

  const $ = id => document.getElementById(id);
  const stage = $("stage"), cookie = $("cookie"), fortuneEl = $("fortune"),
        title = $("title"), sub = $("sub"), again = $("again");

  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ---------- crumbs ---------- */
  function burst() {
    if (reduceMotion) return;
    const colors = ["#d9a05a", "#e8bd80", "#4a2a1b", "#35190e", "#b9743a"];
    for (let i = 0; i < 16; i++) {
      const c = document.createElement("span");
      c.className = "crumb";
      c.style.background = colors[i % colors.length];
      const size = 4 + Math.random() * 6;
      c.style.width = c.style.height = size + "px";
      stage.appendChild(c);
      const angle = Math.random() * Math.PI * 2;
      const dist = 70 + Math.random() * 110;
      const dx = Math.cos(angle) * dist;
      const dy = Math.sin(angle) * dist * 0.7 + 40;
      c.animate([
        { transform: "translate(-50%, -50%) scale(1)", opacity: 1 },
        { transform: `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(.3)`, opacity: 0 }
      ], { duration: 700 + Math.random() * 400, easing: "cubic-bezier(.2,.8,.3,1)" })
        .onfinish = () => c.remove();
    }
  }

  /* ---------- crack / reset ---------- */
  let busy = false;

  function crack() {
    if (busy || stage.classList.contains("is-open")) return;
    busy = true;
    cookie.disabled = true;
    if (navigator.vibrate) navigator.vibrate(30);

    fortuneEl.textContent = MESSAGE;

    const open = () => {
      stage.classList.remove("is-shaking");
      stage.classList.add("is-open");
      title.textContent = "Here’s yours";
      sub.textContent = "This one’s from me to you.";
      burst();
      setTimeout(() => { busy = false; again.focus({ preventScroll: true }); }, 700);
    };

    if (reduceMotion) { open(); return; }
    stage.classList.add("is-shaking");
    setTimeout(open, 500);
  }

  function reset() {
    if (busy) return;
    busy = true;
    stage.classList.remove("is-open");
    title.textContent = "Tap the cookie";
    sub.textContent = "Your fortune is inside.";
    setTimeout(() => {
      cookie.disabled = false;
      busy = false;
      cookie.focus({ preventScroll: true });
    }, reduceMotion ? 20 : 700);
  }

  cookie.addEventListener("click", crack);
  again.addEventListener("click", reset);

})();
</script>
</body>
</html>
